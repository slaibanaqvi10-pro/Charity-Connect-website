{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Charity Connect</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <style>
        *{margin:0;padding:0;box-sizing:border-box;}

        html, body {
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            background: #fff;
        }

        /* NAVBAR */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: #fff;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
        }

        nav h2 {
            font-family: 'Poppins', sans-serif;
            color: #9c4f28;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav ul li a {
            text-decoration: none;
            color: #333;
            font-size: 17px;
            font-weight: bold;
            position: relative;
        }

        nav ul li a::after {
            content:'';
            position:absolute;
            width:0;
            height:3px;
            background:#ff7f50;
            left:0;
            bottom:-5px;
            transition:0.3s;
        }

        nav ul li a:hover::after { width:100%; }

        /* HERO SECTION */
        .hero {
            display:flex;
            height:100vh;
            background-image:url("{% static 'image/world-map.png' %}");
            background-size:cover;
            background-position:center;
        }

        .left, .right { width:50%; }

        .left {
            background:rgba(156,79,40,0.85);
            color:white;
            display:flex;
            flex-direction:column;
            justify-content:center;
            padding:0 50px;
        }

        .left h1 {
            font-family:'Poppins', sans-serif;
            font-size:50px;
            line-height:1.2;
            margin-bottom:20px;
            text-shadow:2px 2px 8px rgba(0,0,0,0.3);
        }

        .left p {
            font-size:18px;
            margin-bottom:30px;
            text-shadow:1px 1px 5px rgba(0,0,0,0.2);
        }

        /* BUTTON STYLE (Same for both buttons) */
        .learn-btn {
            background:#ff7f50;
            color:white;
            padding:12px 25px;
            font-size:16px;
            font-weight:bold;
            border:none;
            border-radius:5px;
            cursor:pointer;
            box-shadow:0 4px 10px rgba(0,0,0,0.3);
            transition:0.3s;
        }

        .learn-btn:hover { background:#e76b3d; }

        .right {
            background-image:url("{% static 'image/gazaa.jpg' %}");
            background-size:cover;
            background-position:right center;
        }

        .logo { width:50px; }

        footer {
            background:#222;
            color:white;
            text-align:center;
            padding:20px 0;
            font-size:1rem;
            letter-spacing:1px;
        }
    </style>
</head>

<body>

    <!-- NAV -->
    <nav>
        <div style="display:flex;align-items:center;gap:15px;">
            <img src="{% static 'image/logoo.png' %}" class="logo">
            <h2>Charity Connect</h2>
        </div>

        <ul>
            <li><a href="{% url 'home' %}">Home</a></li>
        <li><a href="{% url 'about' %}">About</a></li>
        <li><a href="{% url 'services' %}">Services</a></li>
        <li><a href="{% url 'gallery' %}">Gallery</a></li>
            <li><a href="{% url 'donate' %}">Donate</a></li>
            <li><a href="{% url 'campaign_list' %}">Campaign</a></li>
            <li><a href="{% url 'login' %}">Login</a></li>
        </ul>
    </nav>

    <!-- HERO -->
    <div class="hero">
        <div class="left">
            <h1>Your Support<br>Helps Children<br>Survive</h1>
            <p>Help needy people by donating and supporting our charity work.</p>

            <!-- FIXED BUTTONS HERE -->
            <div style="display:flex; gap:15px; margin-top:10px;">

                <a href="{% url 'donate' %}" style="text-decoration:none;">
                    <button class="learn-btn">Donate Now</button>
                </a>

                <a href="{% url 'register' %}" style="text-decoration:none;">
                    <button class="learn-btn">Become a Volunteer</button>
                </a>

            </div>

        </div>

        <div class="right"></div>
    </div>

    <footer>
        © 2025 CharityConnect • Empowering Communities Together
    </footer>

</body>
</html>
