{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - CharityConnect</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

<style>
    *{margin:0;padding:0;box-sizing:border-box;}

    body{
        font-family:'Montserrat',sans-serif;
        background:#c07346;
        margin-top:100px;
        color:#fff;
    }

    /* -------- NAVBAR (Same as Home Page) -------- */
    nav {
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:15px 40px;
        background:#fff;
        box-shadow:0px 2px 8px rgba(0,0,0,0.1);
        position:fixed;
        top:0;
        width:100%;
        z-index:999;
    }

    nav .logo { width:50px; }

    nav ul {
        display:flex;
        list-style:none;
        gap:25px;
    }

    nav ul li a {
        text-decoration:none;
        color:#333;
        font-size:17px;
        font-weight:bold;
        position:relative;
        font-family:'Roboto',sans-serif;
    }

    nav ul li a::after {
        content:'';
        position:absolute;
        width:0;
        height:3px;
        background:#ff7f50;
        left:0;
        bottom:-5px;
        transition:0.3s;
    }

    nav ul li a:hover::after {
        width:100%;
    }

    /* -------- REGISTER FORM -------- */
    .register-section{
        padding:60px 20px;
        display:flex;
        justify-content:center;
    }

    .register-box{
        background:white;
        color:#9c4f28;
        max-width:450px;
        width:100%;
        padding:40px;
        border-radius:15px;
        box-shadow:0 5px 20px rgba(0,0,0,0.25);
    }

    .register-box h2{
        text-align:center;
        margin-bottom:25px;
        font-family:'Poppins',sans-serif;
    }

    label{
        display:block;
        margin-top:15px;
        font-weight:bold;
    }

    input, select{
        width:100%;
        padding:12px;
        margin-top:5px;
        border-radius:8px;
        border:1px solid #ccc;
        font-size:16px;
    }

    button.register-btn{
        background:#ff7f50;
        color:white;
        padding:14px 0;
        font-weight:bold;
        border:none;
        border-radius:8px;
        margin-top:25px;
        width:100%;
        cursor:pointer;
        font-size:16px;
    }

    button.register-btn:hover{
        background:#e76b3d;
    }

    .bottom-text{
        text-align:center;
        margin-top:20px;
        color:#333;
    }

    .bottom-text a{
        color:#9c4f28;
        font-weight:bold;
        text-decoration:none;
    }

    footer{
        margin-top:60px;
        background:white;
        color:#9c4f28;
        text-align:center;
        padding:20px;
    }
</style>
</head>

<body>

<!-- -------- NAVBAR -------- -->
<nav>
    <div style="display:flex;align-items:center;gap:15px;">
        <img src="{% static 'image/logoo.png' %}" class="logo">
        <h2 style="font-family:'Poppins',sans-serif;color:#9c4f28;">Charity Connect</h2>
    </div>

    <ul>
        <li><a href="{% url 'home' %}">Home</a></li>
        <li><a href="{% url 'about' %}">About</a></li>
        <li><a href="{% url 'services' %}">Services</a></li>
        <li><a href="{% url 'gallery' %}">Gallery</a></li>
            <li><a href="{% url 'donate' %}">Donate</a></li>
            <li><a href="{% url 'campaign_list' %}">Campaign</a></li>
            <li><a href="{% url 'login' %}">Login</a></li>
    </ul>
</nav>

<!-- -------- REGISTER FORM -------- -->
<section class="register-section">
    <div class="register-box">
        <h2>Create Account</h2>

        <form method="POST">
            {% csrf_token %}

            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter full name" required />

            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email" required />

            <label>Password</label>
            <input type="password" name="password" placeholder="Create a password" required />

            <label>Confirm Password</label>
            <input type="password" name="confirm_password" placeholder="Re-enter password" required />


            <label>Select Volunteer Work</label>
<select name="volunteer_work">
    <option value="">-- Select Volunteer Work --</option>

    <option value="Flood Relief">Flood Relief</option>
    <option value="Food Distribution">Food Distribution</option>
    <option value="Rehabilitation Center">Rehabilitation Center</option>
    <option value="Orphanage">Orphanage</option>
    <option value="Old Age Home">Old Age Home</option>

</select>


            <button type="submit" class="register-btn">Register</button>
        </form>

        <p class="bottom-text">
            Already have an account? <a href="{% url 'login' %}">Login</a>
        </p>
    </div>
</section>

<footer>
    © 2025 CharityConnect
</footer>

</body>
</html>
