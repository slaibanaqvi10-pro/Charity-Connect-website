{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - CharityConnect</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />

    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }

        body{
            font-family:'Montserrat',sans-serif;
            background:#c07346;
            color:white;
            margin-top:90px;
        }

        /* NAV BAR */
        nav{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:18px 50px;
            background:white;
            box-shadow:0 3px 10px rgba(0,0,0,0.15);
            position:fixed;
            top:0; left:0;
            width:100%;
            z-index:1000;
        }

        nav h2{
            font-family:'Poppins',sans-serif;
            color:#9c4f28;
            font-size:26px;
        }

        nav ul{
            display:flex;
            list-style:none;
            gap:25px;
        }

        nav ul li a{
            text-decoration:none;
            color:#333;
            font-size:17px;
            font-weight:bold;
            position:relative;
            transition:0.3s;
        }

        nav ul li a::after{
            content:'';
            position:absolute;
            width:0;
            height:3px;
            background:#ff7f50;
            left:0;
            bottom:-5px;
            transition:0.3s;
        }
        nav ul li a:hover::after{ width:100%; }

        .logo{ width:55px; margin-right:10px; }

        /* LOGIN BOX */
        .login-section{
            padding:60px 20px;
            text-align:center;
        }

        .login-box{
            background:white;
            color:#9c4f28;
            max-width:400px;
            padding:40px;
            margin:auto;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,0.25);
        }

        .login-box h2{
            margin-bottom:20px;
            font-size:28px;
        }

        label{
            display:block;
            text-align:left;
            margin-top:15px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:12px;
            border-radius:8px;
            border:1px solid #ccc;
            margin-top:5px;
        }

        .login-btn{
            background:#ff7f50;
            color:white;
            padding:14px 0;
            font-size:18px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
            margin-top:25px;
            width:100%;
        }

        .login-btn:hover{
            background:#e76b3d;
        }

        .bottom-text{
            margin-top:15px;
            color:#333;
        }

        .bottom-text a{
            color:#9c4f28;
            font-weight:bold;
            text-decoration:none;
        }

        .bottom-text a:hover{
            text-decoration:underline;
        }

        footer{
            margin-top:60px;
            background:white;
            color:#9c4f28;
            text-align:center;
            padding:20px 0;
            font-size:1rem;
        }
    </style>
</head>

<body>

<!-- NAV BAR -->
<nav>
    <div style="display:flex;align-items:center;">
        <img src="{% static 'image/logoo.png' %}" class="logo" />
        <h2>Charity Connect</h2>
    </div>

    <ul>
        <li><a href="{% url 'home' %}">Home</a></li>
        <li><a href="{% url 'about' %}">About</a></li>
        <li><a href="{% url 'services' %}">Services</a></li>
        <li><a href="{% url 'gallery' %}">Gallery</a></li>
            <li><a href="{% url 'donate' %}">Donate</a></li>
            <li><a href="{% url 'campaign_list' %}">Campaign</a></li>
            <li><a href="{% url 'login' %}">Login</a></li>
    </ul>
</nav>

<!-- LOGIN FORM -->
<section class="login-section">
    <div class="login-box">
        <h2>User Login</h2>

        <form method="POST">
            {% csrf_token %}

            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email" required />

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required />

          <button type="submit" class="login-btn">Login</button>

        </form>

     <p class="bottom-text">
    Don't have an account?
    <a href="{% url 'register' %}">Register</a>
</p>

    </div>
</section>

<!-- FOOTER -->
<footer>
    <b>© 2025 CharityConnect • Empowering Communities Together</b>
</footer>

</body>
</html>
